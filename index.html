<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PT. Duta Hita Jaya Gallery</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
:root{
  --navy:#001a4d; --blue:#003d7a; --brand:#151579;
  --bg:#f3f7fd; --card:#fff; --line:#e3e9f3; --text:#1f2937; --muted:#64748b;
  --tint:#e6eefb; --shadow:0 1px 3px rgba(0,26,77,.10),0 1px 2px rgba(0,26,77,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(180deg,#eef4fc 0,#f8fbff 320px,#f8fbff 100%);color:var(--text);line-height:1.5;min-height:100vh}
button,input,select{font:inherit;color:inherit}
svg.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid #7aa7ff;outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* Header */
.header{background:#fff;position:sticky;top:0;z-index:50;box-shadow:0 1px 0 var(--line)}
.header .wrap{display:flex;align-items:center;justify-content:space-between;height:70px}
.header img{height:48px;width:auto;display:block}
.nav{display:flex;align-items:center;gap:6px}
.nav a{text-decoration:none;font-size:14px;font-weight:600;color:var(--blue);padding:8px 16px;border-radius:999px}
.nav a:hover{background:var(--tint)}
.nav a.on{background:var(--blue);color:#fff}

/* Hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(100deg,#00296b 0%,#003d7a 55%,#0a55a8 100%);color:#fff}
.hero::before{content:"";position:absolute;inset:0;background:
  linear-gradient(115deg,transparent 0 12%,rgba(255,255,255,.05) 12% 30%,transparent 30%),
  linear-gradient(115deg,transparent 0 3%,rgba(0,0,0,.12) 3% 12%,transparent 12%)}
.hero-photo{position:absolute;top:0;bottom:0;right:0;width:64%;background-size:cover;background-position:center 36%;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 48%);mask-image:linear-gradient(90deg,transparent 0,#000 48%)}
.hero-photo.lattice{opacity:.5;background-repeat:no-repeat}
.hero-in{position:relative;display:flex;align-items:center;gap:22px;padding-top:30px;padding-bottom:30px}
.hero-icon{font-size:42px;width:52px;display:flex;justify-content:center}
.hero-icon svg{stroke-width:1.6}
.hero-div{align-self:stretch;width:2px;background:rgba(255,255,255,.85);border-radius:2px}
.hero h1{margin:0 0 4px;font-size:27px;font-weight:700;letter-spacing:-.01em}
.hero p{margin:0;font-size:14.5px;opacity:.92}
.stats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.stat{display:inline-flex;align-items:center;gap:8px;background:rgba(0,26,77,.55);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:600;backdrop-filter:blur(2px)}
.stat svg{font-size:16px}

/* Toolbar */
.toolbar{padding:22px 0 4px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:10px;flex-wrap:wrap}
.pillbtn{display:inline-flex;align-items:center;gap:8px;border:0;background:#fff;border-radius:999px;padding:10px 18px;font-weight:600;font-size:13.5px;color:var(--navy);box-shadow:var(--shadow);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,transform .15s}
.pillbtn svg{font-size:16px}
.pillbtn:hover{transform:translateY(-1px)}
.pillbtn.on{background:var(--blue);color:#fff}
.search{flex:1 1 260px;display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:0 18px;box-shadow:var(--shadow);min-width:0}
.search svg{font-size:17px;color:var(--muted)}
.search input{flex:1;border:0;background:transparent;padding:11px 0;font-size:14px;min-width:0}
.search input:focus{outline:none}
.search:focus-within{box-shadow:0 0 0 3px rgba(0,61,122,.18)}
.sel{position:relative;display:flex;align-items:center;background:#fff;border-radius:999px;box-shadow:var(--shadow)}
.sel>svg{position:absolute;pointer-events:none;color:var(--blue);font-size:16px}
.sel .lead{left:14px}.sel .end{right:14px;color:var(--muted);font-size:15px}
.sel select{appearance:none;-webkit-appearance:none;border:0;background:transparent;padding:10px 38px 10px 38px;font-size:13.5px;font-weight:600;color:var(--navy);cursor:pointer;border-radius:999px;max-width:220px}
.sel select:focus{outline:none}
.sel:focus-within{box-shadow:0 0 0 3px rgba(0,61,122,.18)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.chip{border:0;background:#fff;border-radius:999px;padding:8px 18px;font-size:13px;font-weight:500;cursor:pointer;color:#334155;box-shadow:var(--shadow);transition:background .15s,color .15s}
.chip:hover{color:var(--blue)}
.chip.on{background:var(--blue);color:#fff;font-weight:600}
.meta{display:flex;justify-content:space-between;align-items:center;margin:16px 0 14px;font-size:13.5px;color:var(--muted)}
.meta b{color:var(--navy)}
.reset{border:0;background:none;color:var(--blue);font-weight:600;cursor:pointer;text-decoration:underline;font-size:13.5px}
.reset[hidden]{display:none}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px;padding-bottom:48px}
.card{display:flex;flex-direction:column;width:100%;text-align:left;padding:0;border:0;background:var(--card);border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:0 2px 10px rgba(0,26,77,.07);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,26,77,.14)}
.thumb{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,var(--navy),var(--blue));display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.8);font-size:38px;overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pill{position:absolute;top:12px;left:12px;background:var(--blue);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 12px;border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.play{position:absolute;width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;padding-left:3px}
.play svg{fill:#fff;stroke:#fff;font-size:18px}
.body{padding:16px 18px 18px;flex:1}
.badge{display:inline-block;background:var(--tint);color:var(--blue);font-size:11.5px;font-weight:700;padding:3px 12px;border-radius:999px;margin-bottom:8px}
.body h3{margin:0 0 6px;font-size:16px;line-height:1.4;color:var(--navy)}
.body .info{margin:0 0 8px;font-size:13px;color:var(--muted)}
.body .desc{margin:0;font-size:14px;color:#4b5563;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{display:none;text-align:center;padding:70px 20px;color:var(--muted)}
.empty svg{font-size:54px;stroke-width:1.4;color:#9db3d3}
.empty h3{color:var(--navy);margin:10px 0 4px}

/* Modal */
.modal{display:none;position:fixed;inset:0;background:rgba(0,26,77,.72);z-index:100;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.sheet{background:#fff;border-radius:18px;width:100%;max-width:860px;max-height:92vh;overflow-y:auto;position:relative}
.x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:22px;line-height:1;cursor:pointer;z-index:2}
.x:hover{background:rgba(0,0,0,.75)}
.m-media{aspect-ratio:16/9;background:#0b1220}
.m-media.folder{aspect-ratio:auto;height:420px;background:#fff;border-bottom:1px solid var(--line)}
.m-media iframe{width:100%;height:100%;border:0;display:block}
.m-media.none{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;font-size:64px}
.m-body{padding:22px 24px 26px}
.m-body h2{margin:6px 0 14px;font-size:22px;color:var(--navy);line-height:1.35}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;background:var(--bg);border-radius:12px;padding:14px;margin-bottom:16px}
.facts small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em}
.facts b{color:var(--navy);font-size:14px}
.m-body .d{margin:0 0 18px;color:#4b5563}
.hint{font-size:12px;color:var(--muted);margin:-10px 0 16px}
.btn{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;font-weight:600;padding:11px 22px;border-radius:999px}
.btn:hover{background:var(--navy)}


/* ===== Admin ===== */
.adminlink{background:none;border:0;color:inherit;opacity:.55;font:inherit;cursor:pointer;text-decoration:underline;margin-left:14px;padding:0}
.adminlink:hover{opacity:1}
.admbar{display:none;position:sticky;top:0;z-index:60;background:var(--brand);color:#fff;padding:9px 16px;font-size:13px;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
body.isadmin .admbar{display:flex}
.admbar b{letter-spacing:.04em}
.admbar button{border:0;border-radius:999px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer;background:#fff;color:var(--brand)}
.admbar button.ghost{background:rgba(255,255,255,.16);color:#fff}
.badge.draft{background:#fde8e8;color:#b42318;margin-left:6px}
.adm-pad{padding:26px 24px 24px}
.adm-pad h2{margin:0 0 4px;color:var(--navy);font-size:20px}
.adm-pad p.sub{margin:0 0 6px;color:var(--muted);font-size:13px}
.adm-form label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:13px 0 5px}
.adm-form input,.adm-form select,.adm-form textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;background:#fff;color:var(--text)}
.adm-form textarea{min-height:76px;resize:vertical}
.adm-form input:focus,.adm-form select:focus,.adm-form textarea:focus{outline:2px solid var(--blue);border-color:transparent}
.adm-form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.adm-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.abtn{border:0;border-radius:10px;padding:11px 20px;font:inherit;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}
.abtn:disabled{opacity:.6;cursor:wait}
.abtn.sec{background:var(--tint);color:var(--blue)}
.abtn.del{background:#fde8e8;color:#b42318;margin-left:auto}
.m-body .adm-actions{border-top:1px dashed var(--line);padding-top:16px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);background:#0f172a;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:200;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Footer */
.footer{background:#fff;padding:22px 0;font-size:13px;color:var(--muted)}
.footer details{margin-top:12px}
.footer summary{cursor:pointer;color:var(--blue);font-weight:600}
.footer .up{margin-top:10px}
.footer .up p{margin:8px 0 0;font-size:12px}

@media (max-width:720px){
  .wrap{padding:0 16px}
  .header img{height:40px}
  .hero-in{gap:14px;padding-top:24px;padding-bottom:24px}
  .hero-icon{font-size:30px;width:36px}
  .hero h1{font-size:21px}
  .hero p{font-size:13px}
  .hero-photo{width:100%;opacity:.35}
  .tabs{width:100%}.tabs .pillbtn{flex:1;justify-content:center;padding:10px 8px}
  .search{flex-basis:100%}
  .sel{flex:1 1 calc(50% - 6px)}.sel select{width:100%;max-width:none}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 8px;margin-right:-16px}
  .chip{white-space:nowrap}
  .facts{grid-template-columns:repeat(2,1fr)}
  .m-media.folder{height:340px}
  .m-body{padding:18px}
}
@media (prefers-reduced-motion:reduce){.card,.pillbtn{transition:none}.card:hover,.pillbtn:hover{transform:none}html{scroll-behavior:auto}}
</style>
</head>

/* ===== Helpers ===== */
const $ = id => document.getElementById(id);
const svg = p => '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + p + '</svg>';
const ICON = {
  play: svg('<circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor"/>'),
  playSolid: svg('<polygon points="6 4 20 12 6 20 6 4"/>'),

const label = c => String(c).split(' ').map(w => w.length <= 3 ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => { u = String(u || '').trim(); return /^https?:\/\//i.test(u) ? u : ''; };

function driveInfo(url){
  url = safeUrl(url);
  if (!url) return {kind:'none', id:''};
  let m = url.match(/\/folders\/([\w-]+)/);
  if (m) return {kind:'folder', id:m[1]};
  m = url.match(/\/file\/(?:u\/\d+\/)?d\/([\w-]+)/) || url.match(/[?&]id=([\w-]+)/);
  if (m) return {kind:'file', id:m[1]};
  return {kind:'other', id:''};
}

function toISO(v){
  if (v == null || v === '') return '';
  const p = n => String(n).padStart(2,'0');
  if (v instanceof Date && !isNaN(v)) {
    const d = new Date(v.getTime() + 12*3600*1000); // hindari geser hari karena zona waktu
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
  }
  if (typeof v === 'number') {
    const d = new Date(Math.round((v - 25569) * 86400000));
    return d.getUTCFullYear() + '-' + p(d.getUTCMonth()+1) + '-' + p(d.getUTCDate());
  }
  const s = String(v).trim();
  const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m ? m[1] + '-' + p(m[2]) + '-' + p(m[3]) : '';
}

function formatDate(iso){
  const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return '-';
  return new Date(+m[1], +m[2]-1, +m[3]).toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'});
}

function normalize(raw){
  const row = {};
  Object.keys(raw).forEach(k => row[String(k).trim().toLowerCase()] = raw[k]);
  const txt = k => (row[k] == null ? '' : String(row[k]).trim());
  const tanggal = toISO(row.tanggal_project);
  const jenis = txt('jenis_media').toUpperCase() === 'FOTO' ? 'FOTO' : 'VIDEO';
  const url = safeUrl(txt('google_drive_url')).replace(/\/u\/\d+\//, '/');
  return {
    id: txt('id'),
    judul: txt('judul_project'),
    jenis,
    kategori: (txt('kategori') || 'LAINNYA').toUpperCase(),
    tahun: Number(row.tahun) || (tanggal ? Number(tanggal.slice(0,4)) : 0),
    lokasi: txt('lokasi'),
    tanggal,
    deskripsi: txt('deskripsi'),
    thumb: safeUrl(txt('thumbnail_url')),
    url,
    status: txt('status'),
    drive: driveInfo(url)
  };
}

function prepare(rows){
  return rows.map(normalize)
    .filter(r => r.judul && (adminMode || r.status.toLowerCase() === 'publish'))
    .sort((a,b) => (b.tanggal || '').localeCompare(a.tanggal || '') || (Number(b.id)||0) - (Number(a.id)||0))
    .map((r,i) => Object.assign(r, {k:i}));
}

/* ===== State ===== */
/* >>> ISI dengan URL Web App dari Google Apps Script (lihat panduan). Kosong = pakai file Excel/data bawaan. <<< */
const API_URL = 'https://script.google.com/macros/s/AKfycbz639qmM8-kmYcyfQqO1cuxRIYJ9ZDa1IY3cA8WBMPf7ExDc7iAaSsvv8ahe327ZoGM/exec';

let adminMode = false, adminToken = '', currentRow = null;
let items = prepare(DATA);
const state = {media:'ALL', cat:'ALL', year:'', loc:'', q:''};

function inMedia(r){ return state.media === 'ALL' || r.jenis === state.media; }
function matches(r){
  if (!inMedia(r)) return false;
  if (state.cat !== 'ALL' && r.kategori !== state.cat) return false;
  if (state.year && String(r.tahun) !== state.year) return false;
  if (state.loc && r.lokasi !== state.loc) return false;
  if (state.q){
    const hay = (r.judul + ' ' + r.deskripsi + ' ' + r.kategori + ' ' + r.lokasi).toLowerCase();
    if (!hay.includes(state.q)) return false;
  }
  return true;
}

/* ===== Render controls ===== */
function renderControls(){
  const nAll = items.length;
  const nVid = items.filter(r => r.jenis === 'VIDEO').length;
  const nFoto = items.filter(r => r.jenis === 'FOTO').length;

  $('stats').innerHTML =
    '<span class="stat">' + ICON.play + nVid + ' Video</span><span class="stat">' + ICON.image + nFoto + ' Foto</span>';

  const tabs = [['ALL','Semua','',nAll],['VIDEO','Video',ICON.play,nVid],['FOTO','Foto',ICON.image,nFoto]];
  $('mediaTabs').innerHTML = tabs.map(t =>
    '<button type="button" role="tab" data-media="' + t[0] + '" class="pillbtn ' + (state.media === t[0] ? 'on' : '') +
    '" aria-selected="' + (state.media === t[0]) + '">' + t[2] + t[1] + ' (' + t[3] + ')</button>').join('');

  const pool = items.filter(inMedia);

  const cats = {};
  pool.forEach(r => cats[r.kategori] = (cats[r.kategori] || 0) + 1);
  if (state.cat !== 'ALL' && !cats[state.cat]) state.cat = 'ALL';
  const catList = Object.keys(cats).sort((a,b) => a.localeCompare(b));
  $('chips').innerHTML =
    '<button type="button" class="chip ' + (state.cat === 'ALL' ? 'on' : '') + '" data-cat="ALL">Semua (' + pool.length + ')</button>' +
    catList.map(c => '<button type="button" class="chip ' + (state.cat === c ? 'on' : '') + '" data-cat="' + esc(c) + '">' + esc(label(c)) + ' (' + cats[c] + ')</button>').join('');

  const years = [...new Set(pool.map(r => r.tahun).filter(Boolean))].sort((a,b) => b - a).map(String);
  if (state.year && !years.includes(state.year)) state.year = '';
  $('year').innerHTML = '<option value="">Semua Tahun</option>' + years.map(y => '<option value="' + y + '"' + (state.year === y ? ' selected' : '') + '>' + y + '</option>').join('');

  const locs = [...new Set(pool.map(r => r.lokasi).filter(Boolean))].sort((a,b) => a.localeCompare(b));
  if (state.loc && !locs.includes(state.loc)) state.loc = '';
  $('loc').innerHTML = '<option value="">Semua Lokasi</option>' + locs.map(l => '<option value="' + esc(l) + '"' + (state.loc === l ? ' selected' : '') + '>' + esc(l) + '</option>').join('');
}

/* ===== Render grid ===== */
function thumbUrl(r){
  if (r.thumb){
    const d = driveInfo(r.thumb);
    return d.kind === 'file' ? 'https://drive.google.com/thumbnail?id=' + d.id + '&sz=w640' : r.thumb;
  }
  return r.drive.kind === 'file' ? 'https://drive.google.com/thumbnail?id=' + r.drive.id + '&sz=w640' : '';
}

function renderGrid(){
  const list = items.filter(matches);
  $('shown').textContent = list.length;
  $('total').textContent = items.length;
  $('reset').hidden = !(state.media !== 'ALL' || state.cat !== 'ALL' || state.year || state.loc || state.q);
  $('empty').style.display = list.length ? 'none' : 'block';
  $('grid').style.display = list.length ? 'grid' : 'none';

  $('grid').innerHTML = list.map(r => {
    const t = thumbUrl(r);
    const isVideo = r.jenis === 'VIDEO';
    return '<button type="button" class="card" data-k="' + r.k + '">' +
      '<div class="thumb">' + (isVideo ? '' : ICON.image) +
        (t ? '<img src="' + esc(t) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">' : '') +
        '<span class="pill">' + r.jenis + '</span>' +
        (isVideo ? '<span class="play" aria-hidden="true">' + ICON.playSolid + '</span>' : '') +
      '</div>' +
      '<div class="body">' +
        '<span class="badge">' + esc(label(r.kategori)) + '</span>' + (r.status.toLowerCase() !== 'publish' ? '<span class="badge draft">DRAFT</span>' : '') +
        '<h3>' + esc(r.judul) + '</h3>' +
        '<p class="info">' + formatDate(r.tanggal) + (r.lokasi ? ' · ' + esc(r.lokasi) : '') + '</p>' +
        (r.deskripsi ? '<p class="desc">' + esc(r.deskripsi) + '</p>' : '') +
      '</div></button>';
  }).join('');
}

function refresh(){ renderControls(); renderGrid(); }

/* ===== Modal ===== */
function openModal(k){
  const r = items.find(x => x.k === k);
  if (!r) return;
  let media;
  if (r.drive.kind === 'file'){
    media = '<div class="m-media"><iframe src="https://drive.google.com/file/d/' + r.drive.id + '/preview" allow="autoplay; fullscreen" allowfullscreen title="' + esc(r.judul) + '"></iframe></div>';
  } else if (r.drive.kind === 'folder'){
    media = '<div class="m-media folder"><iframe src="https://drive.google.com/embeddedfolderview?id=' + r.drive.id + '#grid" title="' + esc(r.judul) + '"></iframe></div>';
  } else {
    media = '<div class="m-media none">' + (r.jenis === 'VIDEO' ? ICON.play : ICON.image) + '</div>';
  }
  const hint = r.drive.kind === 'folder'
    ? '<p class="hint">Isi folder ditampilkan di atas. Jika tidak muncul, buka lewat tombol di bawah.</p>' : '';
  const btnLabel = r.drive.kind === 'folder' ? 'Buka folder di Google Drive' : 'Buka di Google Drive';

  $('mBody').innerHTML = media +
    '<div class="m-body">' +
      '<span class="badge">' + r.jenis + ' · ' + esc(label(r.kategori)) + '</span>' +
      '<h2 id="mTitle">' + esc(r.judul) + '</h2>' +
      '<div class="facts">' +
        '<div><small>TANGGAL</small><b>' + formatDate(r.tanggal) + '</b></div>' +
        '<div><small>LOKASI</small><b>' + (esc(r.lokasi) || '-') + '</b></div>' +
        '<div><small>TAHUN</small><b>' + (r.tahun || '-') + '</b></div>' +
        '<div><small>KATEGORI</small><b>' + esc(label(r.kategori)) + '</b></div>' +
      '</div>' +
      (r.deskripsi ? '<p class="d">' + esc(r.deskripsi) + '</p>' : '') +
      hint +
      (r.url ? '<a class="btn" href="' + esc(r.url) + '" target="_blank" rel="noopener noreferrer">' + btnLabel + '</a>' : '') +
    '</div>';

  currentRow = r;
  if (adminMode) $('mBody').querySelector('.m-body').insertAdjacentHTML('beforeend',
    '<div class="adm-actions"><button type="button" class="abtn" data-adm="edit">✎ Edit</button>' +
    '<button type="button" class="abtn del" data-adm="del">Hapus</button></div>');
  $('modal').classList.add('on');
  $('modal').setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  $('mClose').focus();
}

function closeModal(){
  $('modal').classList.remove('on');
  $('modal').setAttribute('aria-hidden', 'true');
  $('mBody').innerHTML = '';           // hentikan pemutaran video
  document.body.style.overflow = '';
}

/* ===== Events ===== */
$('mediaTabs').addEventListener('click', e => {
  const b = e.target.closest('[data-media]'); if (!b) return;
  state.media = b.dataset.media; refresh();
});
$('chips').addEventListener('click', e => {
  const b = e.target.closest('[data-cat]'); if (!b) return;
  state.cat = b.dataset.cat; refresh();
});
$('year').addEventListener('change', e => { state.year = e.target.value; refresh(); });
$('loc').addEventListener('change', e => { state.loc = e.target.value; refresh(); });
$('q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); renderGrid(); });
$('reset').addEventListener('click', () => {
  Object.assign(state, {media:'ALL', cat:'ALL', year:'', loc:'', q:''});
  $('q').value = ''; refresh();
});
$('grid').addEventListener('click', e => {
  const c = e.target.closest('.card'); if (c) openModal(Number(c.dataset.k));
});
$('mClose').addEventListener('click', closeModal);
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('modal').classList.contains('on')) closeModal(); });

/* ===== Toast ===== */
let toastT;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3200); }

/* ===== Muat data: Google Sheets (API) → cadangan file Excel → data bawaan ===== */
const EXCEL_FILE = 'DHJ_Project_Gallery_Rapi.xlsx';
async function loadData(){
  if (API_URL){
    try {
      const url = API_URL + (API_URL.includes('?') ? '&' : '?') + 'action=list' + (adminToken ? '&token=' + encodeURIComponent(adminToken) : '') + '&t=' + Date.now();
      const j = await (await fetch(url, {cache:'no-store'})).json();
      if (!j.ok){
        if (adminToken){ setAdmin(''); return loadData(); }   // kode salah → kembali ke mode publik
        throw new Error(j.error || 'API error');
      }
      const next = prepare(j.rows || []);
      if (!next.length && !adminMode) throw new Error('API mengembalikan 0 data Publish');   // jangan kosongkan halaman
      items = next; refresh(); return;
    } catch (err) { console.warn('Google Sheets tidak terbaca, memakai cadangan:', err); }
  }
  try {
    if (typeof XLSX === 'undefined') return;
    const res = await fetch(EXCEL_FILE + '?v=' + Date.now(), {cache:'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const wb = XLSX.read(new Uint8Array(await res.arrayBuffer()), {type:'array', cellDates:true});
    const next = prepare(XLSX.utils.sheet_to_json(wb.Sheets['Project'] || wb.Sheets[wb.SheetNames[0]], {defval:''}));
    if (next.length){ items = next; refresh(); }
  } catch (err) { console.warn('Memakai data bawaan:', err); }
}

/* ===== Admin ===== */
function setAdmin(tok){
  adminToken = tok || ''; adminMode = !!adminToken;
  document.body.classList.toggle('isadmin', adminMode);
  try { adminToken ? sessionStorage.setItem('dhj_tok', adminToken) : sessionStorage.removeItem('dhj_tok'); } catch (e) {}
}
function showAdm(){ const m = $('adm'); m.classList.add('on'); m.setAttribute('aria-hidden', 'false'); document.body.style.overflow = 'hidden'; }
function closeAdm(){ const m = $('adm'); m.classList.remove('on'); m.setAttribute('aria-hidden', 'true'); $('admBody').innerHTML = ''; if (!$('modal').classList.contains('on')) document.body.style.overflow = ''; }

async function api(action, row){
  const res = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({token:adminToken, action, row})});
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'Gagal menyimpan');
  return j;
}

function openLogin(){
  if (!API_URL){ toast('Fitur admin belum aktif: isi API_URL di index.html'); return; }
  $('admBody').innerHTML = '<div class="adm-pad"><h2>Masuk Admin</h2><p class="sub">Masukkan kode admin yang Anda tulis di Google Apps Script.</p>' +
    '<form class="adm-form" id="loginForm"><label>Kode admin</label><input type="password" id="tokIn" required autofocus>' +
    '<div class="adm-actions"><button class="abtn" type="submit">Masuk</button></div></form></div>';
  showAdm();
  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button'); btn.disabled = true; btn.textContent = 'Memeriksa…';
    setAdmin($('tokIn').value.trim());
    await loadData();
    if (adminMode){ closeAdm(); toast('Mode admin aktif'); } else { btn.disabled = false; btn.textContent = 'Masuk'; toast('Kode admin salah'); }
  });
}

function openForm(r){
  const isNew = !r;
  const p = n => String(n).padStart(2, '0'), n = new Date();
  r = r || {id:'', judul:'', jenis:'VIDEO', kategori:'', lokasi:'', tanggal:n.getFullYear() + '-' + p(n.getMonth()+1) + '-' + p(n.getDate()), deskripsi:'', url:'', thumb:'', status:'Publish'};
  const cats = [...new Set(items.map(x => x.kategori))].sort();
  const locs = [...new Set(items.map(x => x.lokasi).filter(Boolean))].sort();
  const opt = (v, cur) => '<option' + (v === cur ? ' selected' : '') + '>' + v + '</option>';
  $('admBody').innerHTML = '<div class="adm-pad"><h2>' + (isNew ? 'Tambah Project' : 'Edit Project') + '</h2>' +
    '<p class="sub">Perubahan langsung tersimpan di Google Sheets.</p>' +
    '<form class="adm-form" id="admForm">' +
    '<label>Judul project *</label><input name="judul" required maxlength="150" value="' + esc(r.judul) + '">' +
    '<div class="two"><div><label>Jenis media</label><select name="jenis">' + opt('VIDEO', r.jenis) + opt('FOTO', r.jenis) + '</select></div>' +
    '<div><label>Status</label><select name="status">' + opt('Publish', r.status.toLowerCase() === 'draft' ? 'Draft' : 'Publish') + opt('Draft', r.status.toLowerCase() === 'draft' ? 'Draft' : 'Publish') + '</select></div></div>' +
    '<div class="two"><div><label>Kategori</label><input name="kategori" list="dlCat" maxlength="40" placeholder="EVENT, SENAM, …" value="' + esc(r.kategori) + '"></div>' +
    '<div><label>Tanggal</label><input type="date" name="tanggal" value="' + esc(r.tanggal) + '"></div></div>' +
    '<label>Lokasi</label><input name="lokasi" list="dlLoc" maxlength="80" value="' + esc(r.lokasi) + '">' +
    '<label>Deskripsi</label><textarea name="deskripsi" maxlength="600">' + esc(r.deskripsi) + '</textarea>' +
    '<label>Link Google Drive (file atau folder)</label><input type="url" name="url" placeholder="https://drive.google.com/…" value="' + esc(r.url) + '">' +
    '<label>Link thumbnail (opsional)</label><input type="url" name="thumb" placeholder="https://…" value="' + esc(r.thumb) + '">' +
    '<datalist id="dlCat">' + cats.map(c => '<option value="' + esc(c) + '">').join('') + '</datalist>' +
    '<datalist id="dlLoc">' + locs.map(c => '<option value="' + esc(c) + '">').join('') + '</datalist>' +
    '<div class="adm-actions"><button class="abtn" type="submit">Simpan</button><button class="abtn sec" type="button" id="admCancel">Batal</button></div>' +
    '</form></div>';
  showAdm();
  $('admCancel').addEventListener('click', closeAdm);
  $('admForm').addEventListener('submit', async e => {
    e.preventDefault();
    const f = new FormData(e.target), g = k => String(f.get(k) || '').trim();
    const url = g('url'), thumb = g('thumb');
    if ((url && !safeUrl(url)) || (thumb && !safeUrl(thumb))){ toast('Link harus diawali http:// atau https://'); return; }
    const tgl = g('tanggal');
    const row = {id:r.id, judul_project:g('judul'), jenis_media:g('jenis'), kategori:g('kategori') || 'LAINNYA', tahun:Number(tgl.slice(0,4)) || n.getFullYear(),
      lokasi:g('lokasi'), tanggal_project:tgl, deskripsi:g('deskripsi'), thumbnail_url:thumb, google_drive_url:url, status:g('status')};
    const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Menyimpan…';
    try {
      await api(isNew ? 'add' : 'update', row);
      closeAdm(); closeModal(); toast(isNew ? 'Project ditambahkan ke Google Sheets' : 'Perubahan tersimpan');
      await loadData();
    } catch (err) { btn.disabled = false; btn.textContent = 'Simpan'; toast('Gagal: ' + err.message); }
  });
}

$('adminBtn').addEventListener('click', () => adminMode ? toast('Anda sudah masuk sebagai admin') : openLogin());
$('admAdd').addEventListener('click', () => openForm(null));
$('admOut').addEventListener('click', async () => { setAdmin(''); await loadData(); toast('Keluar dari mode admin'); });
$('admClose').addEventListener('click', closeAdm);
$('adm').addEventListener('click', e => { if (e.target === $('adm')) closeAdm(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('adm').classList.contains('on')) closeAdm(); });
$('mBody').addEventListener('click', async e => {
  const b = e.target.closest('[data-adm]'); if (!b || !currentRow) return;
  if (b.dataset.adm === 'edit'){ const r = currentRow; closeModal(); openForm(r); return; }
  if (b.dataset.adm === 'del' && confirm('Hapus "' + currentRow.judul + '" dari Google Sheets? Tindakan ini tidak bisa dibatalkan.\n\nTips: pilih status Draft jika hanya ingin menyembunyikan.')){
    b.disabled = true;
    try { await api('delete', {id:currentRow.id}); closeModal(); toast('Project dihapus'); await loadData(); }
    catch (err) { b.disabled = false; toast('Gagal: ' + err.message); }
  }
});

window.addEventListener('load', () => {
  try { const t = sessionStorage.getItem('dhj_tok'); if (t && API_URL) setAdmin(t); } catch (e) {}
  loadData();
});

refresh();
</script>
